version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  # The documentation site's gems. The library itself has no dependencies.
  - package-ecosystem: bundler
    directory: /docs
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      docs-site:
        patterns: ["*"]
